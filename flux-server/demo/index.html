<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>flux-server · interior repaint</title>
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #12151a;
        --line: #22262e;
        --text: #e8eaee;
        --dim: #8b929e;
        --accent: #7fe0a8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 48px 20px 64px;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.6 ui-sans-serif, system-ui, "Segoe UI", Arial, sans-serif;
      }
      main { width: min(760px, 100%); margin: 0 auto; }
      header { margin-bottom: 28px; }
      h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.02em; }
      header p { margin: 0; color: var(--dim); font-size: 13px; }
      .panel {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        margin-bottom: 16px;
      }
      .drop {
        display: grid;
        place-items: center;
        min-height: 170px;
        padding: 18px;
        border: 1px dashed #2c313a;
        border-radius: 10px;
        color: var(--dim);
        font-size: 13px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.2s, color 0.2s;
      }
      .drop:hover, .drop.dragging { border-color: var(--accent); color: var(--text); }
      .drop img { max-width: 100%; max-height: 260px; border-radius: 8px; }
      .row { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 18px; }
      .surface {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1 1 220px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .surface label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
      input[type="color"] {
        width: 34px;
        height: 28px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: none;
        cursor: pointer;
      }
      .name { color: var(--dim); font-size: 12px; margin-left: auto; }
      button {
        width: 100%;
        margin-top: 18px;
        padding: 12px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #07110b;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { background: #2a303a; color: var(--dim); cursor: not-allowed; }
      .status { min-height: 20px; margin-top: 12px; color: var(--dim); font-size: 12.5px; }
      .status.error { color: #ff8f8f; }
      .result img { width: 100%; border-radius: 10px; display: block; }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 12px;
        color: var(--dim);
        font-size: 12px;
        font-family: ui-monospace, Consolas, monospace;
      }
      a.download {
        display: inline-block;
        margin-top: 14px;
        color: var(--accent);
        font-size: 13px;
        text-decoration: none;
        border-bottom: 1px solid currentColor;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Interior repaint</h1>
        <p>Upload a room, pick the surfaces and a colour. The walls or ceiling get repainted; everything else stays.</p>
      </header>

      <section class="panel">
        <div class="drop" id="drop" role="button" tabindex="0">
          <span id="dropText">Click or drop an image here</span>
          <input type="file" id="file" accept="image/*" hidden />
        </div>

        <div class="row">
          <div class="surface">
            <label><input type="checkbox" id="walls" checked /> Walls</label>
            <input type="color" id="wallColor" value="#e8e2d4" />
            <span class="name" id="wallName">cream</span>
          </div>
          <div class="surface">
            <label><input type="checkbox" id="ceiling" /> Ceiling</label>
            <input type="color" id="ceilingColor" value="#f4f4f4" />
            <span class="name" id="ceilingName">white</span>
          </div>
        </div>

        <button id="run" disabled>Repaint</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </section>

      <section class="panel result" id="result" hidden>
        <img id="output" alt="Repainted room" />
        <div class="stats" id="stats"></div>
        <a class="download" id="download" download="repaint.jpg">Download</a>
      </section>
    </main>

    <script>
      const PALETTE = [
        ["#000000", "black"], ["#f4f4f4", "white"], ["#8a8f98", "grey"],
        ["#e8e2d4", "cream"], ["#d9c9a3", "beige"], ["#c2a878", "sand"],
        ["#7a5c43", "brown"], ["#a9553b", "terracotta"], ["#8c2f2f", "dark red"],
        ["#2f6b4f", "forest green"], ["#3b6ea5", "blue"], ["#1f2a44", "navy"],
        ["#2f6f73", "teal"], ["#d8b64a", "yellow"], ["#c9848f", "dusty pink"],
      ];

      const $ = (id) => document.getElementById(id);
      const drop = $("drop"), fileInput = $("file"), runBtn = $("run");
      const statusEl = $("status"), resultEl = $("result"), output = $("output");

      let payload = null;

      const nearestName = (hex) => {
        const rgb = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
        let best = PALETTE[0][1], bestDist = Infinity;
        for (const [candidate, name] of PALETTE) {
          const c = [1, 3, 5].map((i) => parseInt(candidate.slice(i, i + 2), 16));
          const dist = rgb.reduce((sum, v, i) => sum + (v - c[i]) ** 2, 0);
          if (dist < bestDist) { bestDist = dist; best = name; }
        }
        return best;
      };

      const syncNames = () => {
        $("wallName").textContent = nearestName($("wallColor").value);
        $("ceilingName").textContent = nearestName($("ceilingColor").value);
      };

      async function loadFile(file) {
        if (!file || !file.type.startsWith("image/")) return;
        const bitmap = await createImageBitmap(file);
        const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(bitmap.width * scale);
        canvas.height = Math.round(bitmap.height * scale);
        canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);

        payload = canvas.toDataURL("image/jpeg", 0.9);
        drop.innerHTML = '<img alt="Preview" />';
        drop.querySelector("img").src = payload;
        runBtn.disabled = false;
        resultEl.hidden = true;
        statusEl.textContent = "";
        statusEl.classList.remove("error");
      }

      async function repaint() {
        if (!payload) return;
        const walls = $("walls").checked, ceiling = $("ceiling").checked;
        if (!walls && !ceiling) {
          statusEl.textContent = "Pick at least one surface.";
          statusEl.classList.add("error");
          return;
        }

        runBtn.disabled = true;
        statusEl.classList.remove("error");
        statusEl.textContent = "Working… CPU inference can take a few minutes.";
        resultEl.hidden = true;

        const body = {
          image: payload,
          paintWalls: walls,
          paintCeiling: ceiling,
          wallColor: { name: $("wallName").textContent, hex: $("wallColor").value },
          ceilingColor: { name: $("ceilingName").textContent, hex: $("ceilingColor").value },
        };

        try {
          const response = await fetch("/repaint", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || response.statusText);

          output.src = data.image;
          $("download").href = data.image;
          $("stats").textContent = [
            `${data.stats.width}×${data.stats.height}`,
            `${(data.stats.elapsed_ms / 1000).toFixed(1)}s`,
            `walls ${data.stats.wall_pct}%`,
            `ceiling ${data.stats.ceiling_pct}%`,
          ].join("  ·  ");
          resultEl.hidden = false;
          statusEl.textContent = "Done.";
        } catch (error) {
          statusEl.textContent = error.message;
          statusEl.classList.add("error");
        } finally {
          runBtn.disabled = false;
        }
      }

      drop.addEventListener("click", () => fileInput.click());
      drop.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
      });
      drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("dragging"); });
      drop.addEventListener("dragleave", () => drop.classList.remove("dragging"));
      drop.addEventListener("drop", (e) => {
        e.preventDefault();
        drop.classList.remove("dragging");
        loadFile(e.dataTransfer.files[0]);
      });
      fileInput.addEventListener("change", (e) => loadFile(e.target.files[0]));
      $("wallColor").addEventListener("input", syncNames);
      $("ceilingColor").addEventListener("input", syncNames);
      runBtn.addEventListener("click", repaint);
      syncNames();
    </script>
  </body>
</html>
